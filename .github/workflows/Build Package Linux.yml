name: Build Package Linux

# AnimeJing (2026-09-19): Linux packaging for Fedora 44 KDE Plasma 6
# Wayland + any other Linux. Outputs:
#   - real .AppImage (single file via appimagetool) for any distro
#   - real .rpm (built via fpm from the staged layout, not alien-converted)
#
# We deliberately do NOT produce a .deb — the user runs Fedora and DEB
# support is irrelevant for the target audience.
on:
  workflow_dispatch:
  push:
    tags: [ '*' ]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Package On ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Fedora 44 KDE (AppImage)
            artifactBase: animejing-fedora-appimage
            buildAppImage: true
          - os: ubuntu-latest
            name: Fedora 44 KDE (RPM via fpm)
            artifactBase: animejing-fedora-rpm
            buildRpm: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Set UTF-8 encoding
        run: echo "GRADLE_OPTS=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8" >> $GITHUB_ENV

      - name: Export VERSION from build.gradle.kts
        run: |
          VERSION=$(grep -oE 'version = "[^"]+"' build.gradle.kts | head -1 | sed 's/version = "//;s/"//')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Resolved version: ${VERSION}"

      - name: Grant execute permission on gradlew
        run: chmod +x ./gradlew

      - name: Install packaging toolchain (jpackage + fpm + appimagetool)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fakeroot binutils ruby-dev rpm
          sudo gem install --no-document fpm

      - name: Prepare Kuromoji IPADIC dict (bundled in jar)
        run: echo "Kuromoji IPADIC ships inside kuromoji-ipadic-0.9.0.jar; nothing to download."

      # Build the staged application image (the .app directory that
      # appimagetool / fpm will package). createDistributable picks the
      # correct platform task based on the runner OS; on Linux it
      # produces the .app tree under build/compose/binaries/main/app/.
      - name: Build staged launcher
        run: ./gradlew createDistributable

      - name: Dump jpackage error log on failure
        if: failure()
        run: |
          LOG=$(ls -1t build/compose/logs/createDistributable/jpackage-*-err.txt 2>/dev/null | head -1 || true)
          if [ -n "$LOG" ]; then
            echo "::group::jpackage error log ($LOG)"
            cat "$LOG"
            echo "::endgroup::"
          else
            echo "::warning::no jpackage error log found"
          fi

      - name: Inspect staged launcher
        run: |
          echo "::group::build/compose/binaries tree"
          find build/compose/binaries -maxdepth 4 -type d | head -40
          echo "---files---"
          find build/compose/binaries -maxdepth 4 -type f | head -40
          echo "::endgroup::"

      - name: Locate staged launcher
        id: launcher
        run: |
          APP_DIR=$([ -d build/compose/binaries/main/app/AnimeJing ] && echo build/compose/binaries/main/app/AnimeJing || echo build/compose/binaries/main/app)
          echo "appdir=$APP_DIR" >> "$GITHUB_OUTPUT"
          if [ ! -d "$APP_DIR" ]; then echo "::error::No staged app directory found under build/compose/binaries/main/app"; exit 1; fi
          BIN="$APP_DIR/bin/AnimeJing"
          [ -f "$BIN" ] && chmod +x "$BIN"
          echo "Found staged launcher: $APP_DIR"

      - name: Build AppImage
        if: matrix.buildAppImage
        run: |
          set -e
          curl -sL \
            "https://github.com/AppImageCommunity/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          APPDIR=$PWD/${{ steps.launcher.outputs.appdir }}
          cd build/compose/binaries/main
          /tmp/appimagetool "$APPDIR" animejing.AppImage
          ls -la *.AppImage
          chmod +x animejing.AppImage

      - name: Build RPM via fpm
        if: matrix.buildRpm
        run: |
          set -e
          APP_DIR=$PWD/${{ steps.launcher.outputs.appdir }}
          INSTALL_ROOT=/tmp/animejing-rpm-build
          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT/opt/AnimeJing"
          cp -r "$APP_DIR" "$INSTALL_ROOT/opt/AnimeJing/"
          chmod +x "$INSTALL_ROOT/opt/AnimeJing/bin/AnimeJing"
          fpm \
            -s dir \
            -t rpm \
            -n animejing \
            -v "${VERSION}" \
            --description "AnimeJing — learn Japanese through anime" \
            --url "https://github.com/noame19/AnimeJing" \
            --license "GPL-3.0" \
            --vendor "AnimeJing Project" \
            --maintainer "noame19 <[email protected]>" \
            --depends "java-21-openjdk-headless >= 21" \
            --depends "libgtk-3-0" \
            --depends "libnss3" \
            --depends "fuse" \
            --depends "libxshmfence1" \
            --rpm-digest sha256 \
            -C "$INSTALL_ROOT" \
            -p build/compose/binaries/main/animejing.rpm
          ls -la build/compose/binaries/main/*.rpm

      - name: Upload AppImage
        if: matrix.buildAppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactBase }}
          path: build/compose/binaries/main/animejing.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload RPM
        if: matrix.buildRpm
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactBase }}
          path: build/compose/binaries/main/animejing.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "## AnimeJing Linux build summary" >> $GITHUB_STEP_SUMMARY
          echo "- AppImage branch: ${{ matrix.buildAppImage }}" >> $GITHUB_STEP_SUMMARY
          echo "- RPM branch: ${{ matrix.buildRpm }}" >> $GITHUB_STEP_SUMMARY
          if [ -f build/compose/binaries/main/animejing.AppImage ]; then
            SIZE=$(du -h build/compose/binaries/main/animejing.AppImage | cut -f1)
            echo "- AppImage size: $SIZE" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f build/compose/binaries/main/animejing.rpm ]; then
            SIZE=$(du -h build/compose/binaries/main/animejing.rpm | cut -f1)
            echo "- RPM size: $SIZE" >> $GITHUB_STEP_SUMMARY
          fi